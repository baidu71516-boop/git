name: phase2_task10b_e2e

x-app-environment: &app-environment
  APP_ENV: test
  APP_NAME: influencer-outreach-task10b-e2e
  APP_VERSION: task10b-e2e
  APP_MASTER_KEY: task10b-e2e-synthetic-master-key
  LOG_LEVEL: INFO
  BUSINESS_TIMEZONE: Asia/Shanghai
  FRESHNESS_FRESH_DAYS: "7"
  FRESHNESS_AGING_DAYS: "30"
  FRESHNESS_STALE_DAYS: "90"
  SESSION_COOKIE_NAME: outreach_session
  CSRF_COOKIE_NAME: outreach_csrf
  SESSION_DEFAULT_HOURS: "12"
  SESSION_REMEMBER_DAYS: "30"
  LOGIN_MAX_FAILURES: "5"
  LOGIN_LOCK_SECONDS: "300"
  DATABASE_URL: postgresql+psycopg://task10b_e2e:task10b_e2e_password@postgres:5432/task10b_e2e
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  IMPORT_DATA_DIR: /data/imports
  IMPORT_RETENTION_DAYS: "30"
  IMPORT_MAX_FILE_BYTES: "26214400"
  IMPORT_MAX_BATCH_FILES: "20"
  IMPORT_MAX_BATCH_BYTES: "104857600"
  IMPORT_SOURCE_ACQUIRED_CLOCK_SKEW_SECONDS: "300"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task10b_e2e
      POSTGRES_USER: task10b_e2e
      POSTGRES_PASSWORD: task10b_e2e_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task10b_e2e -d task10b_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --app-dir
      - /workspace/apps/api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *app-environment
    volumes:
      - import_data:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
    command:
      - celery
      - --workdir
      - /workspace/apps/worker
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=default,import,ai,email,analytics
      - --hostname=worker@%h
    environment: *app-environment
    volumes:
      - import_data:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "celery --workdir /workspace/apps/worker -A app.celery_app:celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 | grep -q pong"
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  scheduler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/python.Dockerfile
    command:
      - celery
      - --workdir
      - /workspace/apps/worker
      - -A
      - app.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [frontend]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  import_data:
