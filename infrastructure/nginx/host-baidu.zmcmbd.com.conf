# Install on the production host as /etc/nginx/sites-available/baidu.zmcmbd.com
# and enable it from sites-enabled. Docker Nginx must remain loopback-only.
server {
    listen 80;
    listen [::]:80;
    server_name baidu.zmcmbd.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://baidu.zmcmbd.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name baidu.zmcmbd.com;

    ssl_certificate /etc/letsencrypt/live/baidu.zmcmbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baidu.zmcmbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:18080;
        # Public ingress trust boundary: discard client-supplied XFF here. The
        # loopback-only Docker proxy may preserve this established value.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
