map $http_x_request_id $outreach_request_id {
    default $http_x_request_id;
    "" $request_id;
}

# This configuration is safe only when this Docker Nginx listener is bound to
# loopback and a trusted host Nginx is the sole public ingress. It preserves
# the forwarding values established by that host proxy. Do not use it for a
# Docker Nginx that is directly reachable from the Internet.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream outreach_web {
    zone outreach_web 64k;
    server web:3000 resolve;
}

upstream outreach_api {
    zone outreach_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    # Leave room for multipart framing; the API enforces the 25 MiB file limit.
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /health/ {
        proxy_pass http://outreach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $outreach_request_id;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://outreach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $outreach_request_id;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://outreach_web;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $outreach_request_id;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
