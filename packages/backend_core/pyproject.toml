[project]
name = "backend-core"
version = "0.1.0"
description = "Shared backend core for the influencer outreach system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend_core"]
